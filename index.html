<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Fleet Manager - Firebase Realtime</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNDpYOnptuNoYAtXNfS0byXJE4u39zycw",
            authDomain: "teessatrans-fleet.firebaseapp.com",
            projectId: "teessatrans-fleet",
            storageBucket: "teessatrans-fleet.firebasestorage.app",
            messagingSenderId: "517400275173",
            appId: "1:517400275173:web:5de5eee95771f96a858c0c",
            measurementId: "G-Z1ZWYVM0SN",
            databaseURL: "https://teessatrans-fleet-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Глобальные переменные для доступа из других функций
        window.db = db;
        window.ref = ref;
        window.set = set;

        let fleetData = [];
        let actionLog = [];
        let currentSelectedIndex = null;
        let editingHitchIndex = null;

        window.checkPassword = function() {
            const pass = document.getElementById('passwordInput').value.trim();
            if (pass === 'tt13') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                sessionStorage.setItem('isLoggedIn', 'true');
                initFirebaseSync();
            } else {
                document.getElementById('authError').style.display = 'block';
            }
        };

        window.onload = function() {
            if (sessionStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                initFirebaseSync();
            }
        };

        // Подключаем реальное время Firebase
        function initFirebaseSync() {
            const fleetRef = ref(db, 'fleetData');
            const logRef = ref(db, 'actionLog');

            onValue(fleetRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    fleetData = data;
                    processData();
                    if (currentSelectedIndex !== null) renderTable();
                } else {
                    // Если база пустая, заливаем дефолтные данные
                    set(fleetRef, fleetData);
                }
            });

            onValue(logRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    actionLog = data;
                    renderLog();
                }
            });
        }

        window.saveDataToFirebase = function() {
            const fleetRef = ref(db, 'fleetData');
            const logRef = ref(db, 'actionLog');
            set(fleetRef, fleetData);
            set(logRef, actionLog);
        };

        window.addLog = function(text) {
            const timeStr = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            actionLog.unshift(`[${timeStr}] ${text}`);
            if (actionLog.length > 40) actionLog.pop();
            saveDataToFirebase();
        };

        function processData() {
            const totalEl = document.getElementById('totalCount');
            const emptyEl = document.getElementById('emptyMessage');
            if (totalEl) totalEl.innerText = fleetData.length;
            if (emptyEl) emptyEl.innerText = 'Используйте поисковую строку выше для поиска...';
            initAlerts();
            renderLog();
        }

        window.renderLog = function() {
            const container = document.getElementById('actionLogContainer');
            if (container) {
                container.innerHTML = actionLog.map(log => `<div class="log-item">${log}</div>`).join('');
            }
        };

        function checkDateStatus(dateStr) {
            if (!dateStr || dateStr === "—") return {cls: "", text: "—", status: "ok"};
            const parts = dateStr.split('.');
            if (parts.length !== 3) return {cls: "", text: dateStr, status: "ok"};
            const targetDate = new Date(parts[2], parts[1] - 1, parts[0]);
            const today = new Date();
            const diffDays = Math.ceil((targetDate - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) return {cls: "status-expired", text: `${dateStr} (Просрочено!)`, status: "expired"};
            if (diffDays <= 30) return {cls: "status-warning", text: `${dateStr} (${diffDays} дн.)`, status: "warning"};
            return {cls: "status-ok", text: dateStr, status: "ok"};
        }

        function initAlerts() {
            let exp = 0, warn = 0, ok = 0;
            let expList = [], warnList = [], okList = [];

            fleetData.forEach((item, idx) => {
                const ta = checkDateStatus(item.ta || item.ТЕХОСМОТР);
                if (ta.status === 'expired') { exp++; expList.push({idx, item}); }
                else if (ta.status === 'warning') { warn++; warnList.push({idx, item}); }
                else { ok++; okList.push({idx, item}); }
            });

            const expCount = document.getElementById('countExpired');
            const warnCount = document.getElementById('countWarning');
            const okCount = document.getElementById('countOk');

            if (expCount) expCount.innerText = `${exp} ед.`;
            if (warnCount) warnCount.innerText = `${warn} ед.`;
            if (okCount) okCount.innerText = `${ok} ед.`;

            fillList('expiredItemsContainer', expList, '#c5221f');
            fillList('warningItemsContainer', warnList, '#b06000');
            fillList('okItemsContainer', okList, '#137333');
        }

        function fillList(elementId, list, color) {
            const box = document.getElementById(elementId);
            if (!box) return;
            box.innerHTML = '';
            list.forEach(el => {
                box.innerHTML += `
                    <div class="list-item" onclick="selectItem(${el.idx})">
                        <span><b>${el.item.num || el.item.номер}</b> (${el.item.model || el.item.модель || ''})</span>
                        <span style="color: ${color}; font-weight: bold;">${el.item.ta || '—'}</span>
                    </div>
                `;
            });
        }

        window.toggleList = function(id) {
            ['expiredListBox', 'warningListBox', 'okListBox'].forEach(boxId => {
                const b = document.getElementById(boxId);
                if (b) {
                    if (boxId !== id) b.style.display = 'none';
                    else b.style.display = (b.style.display === 'block') ? 'none' : 'block';
                }
            });
        };

        window.selectItem = function(index) {
            currentSelectedIndex = index;
            ['expiredListBox', 'warningListBox', 'okListBox'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = 'none';
            });
            
            document.getElementById("emptyMessage").style.display = "none";
            document.getElementById("fleetTable").style.display = "table";

            renderTable();
        };

        window.renderTable = function() {
            if (currentSelectedIndex === null) return;
            const item = fleetData[currentSelectedIndex];
            if (!item) return;

            const taStatus = checkDateStatus(item.ta);
            const tachoStatus = checkDateStatus(item.tacho);
            const insStatus = checkDateStatus(item.ins);
            const licStatus = checkDateStatus(item.lic);

            let archiveHtml = '';
            if (item.repairHistory && item.repairHistory.length > 0) {
                archiveHtml = `<div class="archive-box"><b>Архив ремонтов:</b><br>` + item.repairHistory.join('<br>') + `</div>`;
            }

            document.getElementById("tableBody").innerHTML = `
                <tr>
                    <td><b>${item.num}</b> (${item.model})<br><div class="csdd-info">VIN: ${item.vin || '—'}</div></td>
                    <td><span class="driver-badge" onclick="editField(${currentSelectedIndex}, 'driver', 'Водитель')">👤 ${item.driver || '—'} ✏️</span></td>
                    <td><span class="hitch-badge" onclick="openHitchModal(${currentSelectedIndex})">🔗 ${item.hitch || item.сцепка || '—'} ✏️</span></td>
                    <td><span class="${taStatus.cls}">${taStatus.text}</span> <span class="edit-icon" onclick="editField(${currentSelectedIndex}, 'ta', 'Техосмотр')">✏️</span></td>
                    <td><span class="${tachoStatus.cls}">${tachoStatus.text}</span> <span class="edit-icon" onclick="editField(${currentSelectedIndex}, 'tacho', 'Тахограф')">✏️</span></td>
                    <td><span class="${insStatus.cls}">${insStatus.text}</span> <span class="edit-icon" onclick="editField(${currentSelectedIndex}, 'ins', 'Страховка')">✏️</span></td>
                    <td><span class="${licStatus.cls}">${licStatus.text}</span> <span class="edit-icon" onclick="editField(${currentSelectedIndex}, 'lic', 'Лицензия')">✏️</span></td>
                    <td onclick="editField(${currentSelectedIndex}, 'tire', 'Резина')" style="cursor:pointer;">${item.tire || '—'} ✏️</td>
                    <td onclick="editField(${currentSelectedIndex}, 'bat', 'Аккумуляторы')" style="cursor:pointer;">${item.bat || '—'} ✏️</td>
                    <td onclick="editField(${currentSelectedIndex}, 'pads', 'Колодки')" style="cursor:pointer;">${item.pads || '—'} ✏️</td>
                    <td onclick="editField(${currentSelectedIndex}, 'clutch', 'Сцепление')" style="cursor:pointer;">${item.clutch || '—'} ✏️</td>
                    <td>
                        ${item.task || 'Нет'} <span class="edit-icon" onclick="editField(${currentSelectedIndex}, 'task', 'Ремонт')">✏️</span>
                        ${archiveHtml}
                    </td>
                    <td>
                        <button class="btn-tbl btn-edit" onclick="editField(${currentSelectedIndex}, 'model', 'Модель')">Изменить</button>
                        <button class="btn-tbl btn-archive" onclick="moveToArchive(${currentSelectedIndex})">Архив</button>
                        <button class="btn-tbl btn-del" onclick="deleteItem(${currentSelectedIndex})">Удалить</button>
                    </td>
                </tr>
            `;
        };

        window.editField = function(index, field, label) {
            const cur = fleetData[index][field] || '';
            const res = prompt(`Изменить поле "${label}":`, cur);
            if (res !== null) {
                fleetData[index][field] = res.trim();
                addLog(`Изменено поле "${label}" у ${fleetData[index].num}`);
                saveDataToFirebase();
                renderTable();
            }
        };

        window.openHitchModal = function(index) {
            editingHitchIndex = index;
            const item = fleetData[index];
            document.getElementById('modalInfo').innerText = `Единица: ${item.num} (${item.model}). Текущая сцепка: ${item.hitch || '—'}`;
            document.getElementById('hitchInput').value = item.hitch === '—' ? '' : item.hitch;
            document.getElementById('modalSuggestions').style.display = 'none';
            document.getElementById('hitchModal').style.display = 'flex';
        };

        window.closeHitchModal = function() {
            document.getElementById('hitchModal').style.display = 'none';
            document.getElementById('modalSuggestions').style.display = 'none';
            editingHitchIndex = null;
        };

        window.setHitchValue = function(val) {
            document.getElementById('hitchInput').value = val;
            document.getElementById('modalSuggestions').style.display = 'none';
            saveHitchModal();
        };

        window.onModalSearchInput = function() {
            const q = document.getElementById('hitchInput').value.toUpperCase().trim();
            const box = document.getElementById('modalSuggestions');
            box.innerHTML = '';
            if (!q) { box.style.display = 'none'; return; }

            let matches = [];
            fleetData.forEach(el => {
                if (el.num.toUpperCase().includes(q)) {
                    matches.push(el);
                }
            });

            if (matches.length > 0) {
                matches.slice(0, 10).forEach(el => {
                    box.innerHTML += `<div class="modal-suggestion-item" onclick="selectModalSuggestion('${el.num}')"><b>${el.num}</b> — ${el.model} (${el.driver || '—'})</div>`;
                });
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        };

        window.selectModalSuggestion = function(num) {
            document.getElementById('hitchInput').value = num;
            document.getElementById('modalSuggestions').style.display = 'none';
        };

        window.saveHitchModal = function() {
            if (editingHitchIndex === null) return;
            const targetTruck = fleetData[editingHitchIndex];
            const inputVal = document.getElementById('hitchInput').value.toUpperCase().trim();
            const newHitchNum = inputVal === '' ? '—' : inputVal;
            const oldHitchNum = targetTruck.hitch || '—';

            if (newHitchNum === oldHitchNum) {
                closeHitchModal();
                return;
            }

            let inheritedTrailer = null;
            if (newHitchNum !== '—') {
                const foundObj = fleetData.find(el => el.num.toUpperCase() === newHitchNum);
                if (foundObj && foundObj.hitch && foundObj.hitch !== '—') {
                    inheritedTrailer = foundObj.hitch;
                }
            }

            if (oldHitchNum !== '—') {
                fleetData.forEach(el => {
                    if (el.num.toUpperCase() === oldHitchNum.toUpperCase()) {
                        if (el.hitch === targetTruck.num) el.hitch = '—';
                    }
                });
            }

            targetTruck.hitch = newHitchNum;

            if (inheritedTrailer) {
                targetTruck.hitch = inheritedTrailer;
                fleetData.forEach(el => {
                    if (el.num.toUpperCase() === inheritedTrailer.toUpperCase()) {
                        el.hitch = targetTruck.num;
                    }
                });
                addLog(`Зеркальный обмен: ${targetTruck.num} забрал прицеп ${inheritedTrailer} от ${newHitchNum}`);
            } else if (newHitchNum !== '—') {
                fleetData.forEach(el => {
                    if (el.num.toUpperCase() === newHitchNum.toUpperCase()) {
                        el.hitch = targetTruck.num;
                    }
                });
                addLog(`Зеркальная сцепка между ${targetTruck.num} и ${newHitchNum}`);
            } else {
                addLog(`Отцеплен прицеп от ${targetTruck.num}`);
            }

            saveDataToFirebase();
            renderTable();
            closeHitchModal();
            alert(`Успех! Сцепка обновлена.`);
        };

        window.moveToArchive = function(index) {
            const item = fleetData[index];
            const note = prompt("Заметка для архива ремонтов:", item.task || "Ремонт выполнен");
            if (note !== null) {
                if (!item.repairHistory) item.repairHistory = [];
                item.repairHistory.unshift(`[${new Date().toLocaleDateString()}] ${note.trim()}`);
                item.task = "Нет";
                addLog(`Ремонт по ${item.num} перенесен в архив`);
                saveDataToFirebase();
                renderTable();
            }
        };

        window.deleteItem = function(index) {
            if (confirm("Точно удалить эту единицу из базы?")) {
                const num = fleetData[index].num;
                fleetData.splice(index, 1);
                addLog(`Удалена единица ${num} из базы`);
                saveDataToFirebase();
                currentSelectedIndex = null;
                document.getElementById("fleetTable").style.display = "none";
                document.getElementById("emptyMessage").style.display = "block";
                document.getElementById('totalCount').innerText = fleetData.length;
            }
        };

        window.addNewItem = function() {
            const type = prompt("Тип ('truck' - тягач, 'trailer' - прицеп):", "truck");
            if (!type) return;
            const num = prompt("Введите госномер:", "AA0000");
            if (!num) return;
            const model = prompt("Модель:", "VOLVO FH");

            const newItem = {
                type: type.trim().toLowerCase(),
                num: num.trim().toUpperCase(),
                model: model ? model.trim() : "—",
                driver: "Водитель не указан",
                ta: "01.01.2027",
                hitch: "—",
                vin: "—",
                tacho: "01.01.2027",
                ins: "01.01.2027",
                lic: "01.01.2027",
                tire: "Стандарт",
                bat: "Ок",
                pads: "Ок",
                clutch: "Ок",
                task: "Нет",
                repairHistory: []
            };

            fleetData.push(newItem);
            addLog(`Добавлена новая единица ${newItem.num}`);
            saveDataToFirebase();
            document.getElementById('totalCount').innerText = fleetData.length;
            alert("Единица успешно добавлена!");
        };
    </script>
</head>
<body>
    <!-- Здесь продолжается твой HTML-интерфейс -->
</body>
</html>
